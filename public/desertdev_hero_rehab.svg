<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="desertSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C15" />
      <stop offset="50%" stop-color="#0D3025" />
      <stop offset="100%" stop-color="#1B4D3E" />
    </linearGradient>
    <linearGradient id="sandGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B774" />
      <stop offset="50%" stop-color="#F4D29D" />
      <stop offset="100%" stop-color="#2D7D62" />
    </linearGradient>
    <linearGradient id="rehabGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143D31" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09241C" stop-opacity="0.9" />
    </linearGradient>
    <filter id="rehabGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Forest Green & Arid Night Sky -->
  <rect width="1200" height="675" fill="url(#desertSky)" />

  <!-- GIS Topographical Contour Mesh & Afforestation Grid -->
  <g opacity="0.15" stroke="#2D7D62" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Desert Sand Dunes & Green Belt Silhouettes -->
  <g fill="#05140F" opacity="0.6">
    <path d="M 0,420 Q 250,320 500,400 Q 750,480 1000,340 Q 1150,280 1200,320 L 1200,675 L 0,675 Z" />
    <!-- Distant Palm & Acacia Tree Silhouettes -->
    <circle cx="120" cy="340" r="18" fill="#0A2A1F" />
    <circle cx="180" cy="355" r="22" fill="#0A2A1F" />
    <circle cx="240" cy="335" r="16" fill="#0A2A1F" />
    <circle cx="950" cy="310" r="24" fill="#0A2A1F" />
    <circle cx="1020" cy="290" r="20" fill="#0A2A1F" />
    <circle cx="1080" cy="305" r="26" fill="#0A2A1F" />
  </g>

  <!-- Central Desert Ecological Engineering & Water Telemetry Console -->
  <g transform="translate(300, 100)">
    <!-- Main Board Glass Screen -->
    <rect x="0" y="0" width="600" height="370" rx="16" fill="url(#rehabGlass)" stroke="#2D7D62" stroke-width="2.5" filter="url(#rehabGlow)" />
    <!-- Header Bar -->
    <rect x="0" y="0" width="600" height="45" rx="16" fill="#0A251D" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#E2B774" font-family="sans-serif" font-size="12" font-weight="bold">DESERT REHABILITATION // ECOLOGICAL RESTORATION &amp; WATER TELEMETRY</text>

    <!-- Sub-Dashboard 1: Soil Moisture & Drip Irrigation (Left) -->
    <g transform="translate(25, 65)">
      <rect width="260" height="155" rx="10" fill="#061A13" stroke="#1B4D3E" stroke-width="1.5" />
      <text x="15" y="24" fill="#E2B774" font-family="sans-serif" font-size="11" font-weight="bold">SOIL REGENERATION &amp; MOISTURE</text>
      <!-- Moisture / Biomass line graph -->
      <line x1="25" y1="130" x2="235" y2="130" stroke="#0F382B" stroke-width="1" />
      <line x1="25" y1="40" x2="25" y2="130" stroke="#0F382B" stroke-width="1" />
      <polygon points="25,125 60,110 100,85 140,65 180,45 225,30 225,130 25,130" fill="#2D7D62" fill-opacity="0.25" />
      <polyline points="25,125 60,110 100,85 140,65 180,45 225,30" fill="none" stroke="#E2B774" stroke-width="2.5" />
      <circle cx="60" cy="110" r="3.5" fill="#2D7D62" />
      <circle cx="100" cy="85" r="3.5" fill="#2D7D62" />
      <circle cx="140" cy="65" r="3.5" fill="#2D7D62" />
      <circle cx="180" cy="45" r="3.5" fill="#2D7D62" />
      <circle cx="225" cy="30" r="5" fill="#10B981" />
      <text x="135" y="26" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">+82% VEGETATION</text>
    </g>

    <!-- Sub-Dashboard 2: Afforestation Species & Groundwater Telemetry (Right) -->
    <g transform="translate(310, 65)">
      <rect width="265" height="155" rx="10" fill="#061A13" stroke="#1B4D3E" stroke-width="1.5" />
      <text x="15" y="24" fill="#E2B774" font-family="sans-serif" font-size="11" font-weight="bold">DESERT FLORA SURVIVAL RATE</text>
      <!-- Telemetry Bars -->
      <g transform="translate(15, 38)">
        <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="9">Acacia Nilotica (Kikar)</text>
        <rect x="110" y="3" width="110" height="12" rx="3" fill="#2D7D62" />
        <text x="225" y="13" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">96.8%</text>
        
        <text x="0" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="9">Prosopis Cineraria (Kandi)</text>
        <rect x="110" y="25" width="105" height="12" rx="3" fill="#1B4D3E" />
        <text x="220" y="35" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">94.2%</text>

        <text x="0" y="56" fill="#E2E8F0" font-family="sans-serif" font-size="9">Ziziphus Mauritiana (Ber)</text>
        <rect x="110" y="47" width="118" height="12" rx="3" fill="#E2B774" />
        <text x="232" y="57" fill="#E2B774" font-family="sans-serif" font-size="9" font-weight="bold">98.1%</text>

        <text x="0" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="9">Tamarix Aphylla (Ghaz)</text>
        <rect x="110" y="69" width="100" height="12" rx="3" fill="#00D2C8" />
        <text x="215" y="79" fill="#00D2C8" font-family="sans-serif" font-size="9" font-weight="bold">92.5%</text>
      </g>
    </g>

    <!-- Bottom Desert Telemetry Log -->
    <g transform="translate(25, 235)">
      <rect width="550" height="115" rx="10" fill="#030E0A" stroke="#1B4D3E" stroke-width="1.5" />
      <text x="15" y="25" fill="#E2B774" font-family="monospace" font-size="11">&gt; solar_pumps.recharge_aquifer(capacity=&quot;1.2M GPD&quot;, salinity_reduction=&quot;-76%&quot;)</text>
      <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">&gt; dune_stabilization.execute_mechanical_mesh(area=&quot;25,000 Hectares&quot;, wind=&quot;PASS&quot;)</text>
      <text x="15" y="71" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; afforestation_drone.seed_dispersal(trees=&quot;5,000,000+ Planted&quot;, survival=&quot;98%&quot;)</text>
      <text x="15" y="94" fill="#00D2C8" font-family="monospace" font-size="11">&gt; [OK] 200+ DESERT REHABILITATION PROJECTS DELIVERED NATIONWIDE</text>
    </g>
  </g>

  <!-- Left Floating UNEP & Anti-Desertification Badge -->
  <g transform="translate(90, 180)">
    <rect width="180" height="240" rx="16" fill="#0B251D" stroke="#2D7D62" stroke-width="2" filter="url(#rehabGlow)" />
    <!-- Tree & Sprout Graphic -->
    <g transform="translate(90, 80)">
      <!-- Sprout / Tree -->
      <path d="M 0,20 L 0,-15" stroke="#E2B774" stroke-width="3" stroke-linecap="round" />
      <path d="M 0,-15 Q -18,-35 0,-40 Q 18,-35 0,-15" fill="#10B981" />
      <path d="M 0,-5 Q -14,-15 -20,-5 Q -10,5 0,-5" fill="#2D7D62" />
      <path d="M 0,-5 Q 14,-15 20,-5 Q 10,5 0,-5" fill="#2D7D62" />
      <circle cx="0" cy="22" r="3" fill="#E2B774" />
    </g>
    <text x="90" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5M+ TREES</text>
    <text x="90" y="182" fill="#10B981" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">AFFORESTATION</text>
    <text x="90" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Arid Land Greening</text>
  </g>

  <!-- Right Floating 200+ Projects Completed Emblem -->
  <g transform="translate(930, 180)">
    <rect width="190" height="240" rx="16" fill="#0B251D" stroke="#2D7D62" stroke-width="2" filter="url(#rehabGlow)" />
    <!-- Sun / Compass / Terrain Emblem -->
    <g transform="translate(95, 80)">
      <circle cx="0" cy="0" r="26" fill="#0D3025" stroke="#E2B774" stroke-width="2" />
      <!-- Sun Rays & Water Droplet -->
      <path d="M0,-15 L0,-22 M12,-10 L17,-15 M15,0 L22,0 M12,10 L17,15 M0,15 L0,22 M-12,10 L-17,15 M-15,0 L-22,0 M-12,-10 L-17,-15" stroke="#E2B774" stroke-width="1.5" />
      <!-- Water Droplet -->
      <path d="M 0,-8 Q -6,4 0,8 Q 6,4 0,-8" fill="#00D2C8" />
    </g>
    <text x="95" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">200+ PROJECTS</text>
    <text x="95" y="182" fill="#E2B774" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">ECOLOGICAL RESTORATION</text>
    <text x="95" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">30+ Restored Regions</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="520" height="65" rx="16" fill="#0B251D" stroke="#2D7D62" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#2D7D62" />
    <text x="64" y="29" fill="#E2B774" font-family="sans-serif" font-size="13" font-weight="bold">DESERT DEVELOPMENT &amp; REHABILITATION</text>
    <text x="64" y="47" fill="#F7FBF9" font-family="sans-serif" font-size="10.5">Arid Land Reclamation · Afforestation · Sustainable Water Engineering</text>
  </g>
</svg>
