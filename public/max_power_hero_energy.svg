<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyMax" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#0E4B7E" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="electricGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="solarField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="powerGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Electric Sky -->
  <rect width="1200" height="675" fill="url(#skyMax)" />

  <!-- Rolling Hills & Industrial Horizon -->
  <g fill="#0B1E33" opacity="0.6">
    <path d="M0,380 Q300,320 600,360 Q900,400 1200,350 L1200,675 L0,675 Z" />
    <path d="M0,430 Q350,390 700,420 Q1050,450 1200,410 L1200,675 L0,675 Z" fill="#0A192A" />
  </g>

  <!-- Modern Wind Energy Turbines (Background Left & Center) -->
  <g transform="translate(180, 240)">
    <!-- Tower -->
    <polygon points="48,160 52,160 51,20 49,20" fill="#E2E8F0" />
    <circle cx="50" cy="20" r="4" fill="#F5A623" />
    <!-- Rotor Blades -->
    <line x1="50" y1="20" x2="50" y2="-45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="20" x2="105" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="20" x2="-5" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
  <g transform="translate(320, 260) scale(0.8)">
    <polygon points="48,160 52,160 51,20 49,20" fill="#E2E8F0" />
    <circle cx="50" cy="20" r="4" fill="#F5A623" />
    <line x1="50" y1="20" x2="50" y2="-45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="20" x2="105" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="50" y1="20" x2="-5" y2="50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- High-Voltage 500kV Transmission Tower 1 (Center) -->
  <g transform="translate(560, 110)">
    <!-- Steel Lattice Pylon Body -->
    <polygon points="40,320 80,320 65,30 55,30" fill="none" stroke="#E2E8F0" stroke-width="2.5" />
    <!-- Cross Bracing Lattice -->
    <line x1="43" y1="280" x2="77" y2="280" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="47" y1="230" x2="73" y2="230" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="50" y1="170" x2="70" y2="170" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="53" y1="100" x2="67" y2="100" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Diagonal Lattice Crosses -->
    <line x1="40" y1="320" x2="77" y2="280" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="80" y1="320" x2="43" y2="280" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="43" y1="280" x2="73" y2="230" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="77" y1="280" x2="47" y2="230" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="47" y1="230" x2="70" y2="170" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="73" y1="230" x2="50" y2="170" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Top & Middle Crossarms (Insulator String Holders) -->
    <line x1="-30" y1="90" x2="150" y2="90" stroke="#E2E8F0" stroke-width="3.5" />
    <line x1="-45" y1="150" x2="165" y2="150" stroke="#E2E8F0" stroke-width="3.5" />
    <!-- Hanging Ceramic Insulators -->
    <line x1="-25" y1="90" x2="-25" y2="115" stroke="#F5A623" stroke-width="3" />
    <line x1="145" y1="90" x2="145" y2="115" stroke="#F5A623" stroke-width="3" />
    <line x1="-40" y1="150" x2="-40" y2="175" stroke="#F5A623" stroke-width="3" />
    <line x1="160" y1="150" x2="160" y2="175" stroke="#F5A623" stroke-width="3" />
    <!-- Glowing Transmission Conductor Cables -->
    <path d="M-560,70 Q-25,125 535,115 Q850,115 1200,90" fill="none" stroke="#F5A623" stroke-width="2.5" filter="url(#powerGlow)" />
    <path d="M-560,130 Q-40,185 720,175 Q960,175 1200,150" fill="none" stroke="#F5A623" stroke-width="2.5" filter="url(#powerGlow)" />
  </g>

  <!-- Industrial Power Generation & Substation Facility (Foreground) -->
  <polygon points="0,460 1200,460 1200,675 0,675" fill="#0A192F" />

  <!-- Utility Scale Solar Photovoltaic Farm (Left Side) -->
  <g transform="translate(60, 480)">
    <!-- Solar Row 1 -->
    <polygon points="20,80 160,80 140,125 0,125" fill="url(#solarField)" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="50" y1="80" x2="30" y2="125" stroke="#38BDF8" stroke-width="1" />
    <line x1="90" y1="80" x2="70" y2="125" stroke="#38BDF8" stroke-width="1" />
    <line x1="130" y1="80" x2="110" y2="125" stroke="#38BDF8" stroke-width="1" />
    <!-- Solar Row 2 -->
    <polygon points="180,80 320,80 300,125 160,125" fill="url(#solarField)" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="210" y1="80" x2="190" y2="125" stroke="#38BDF8" stroke-width="1" />
    <line x1="250" y1="80" x2="230" y2="125" stroke="#38BDF8" stroke-width="1" />
    <line x1="290" y1="80" x2="270" y2="125" stroke="#38BDF8" stroke-width="1" />
    <!-- Solar Row 3 (Foreground) -->
    <polygon points="40,140 220,140 190,185 10,185" fill="url(#solarField)" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="85" y1="140" x2="55" y2="185" stroke="#38BDF8" stroke-width="1" />
    <line x1="130" y1="140" x2="100" y2="185" stroke="#38BDF8" stroke-width="1" />
    <line x1="175" y1="140" x2="145" y2="185" stroke="#38BDF8" stroke-width="1" />
  </g>

  <!-- Containerized Battery Energy Storage Systems (BESS) & Transformers (Right) -->
  <g transform="translate(760, 470)">
    <!-- BESS Container 1 -->
    <rect x="0" y="30" width="160" height="90" rx="4" fill="#1E293B" stroke="#0E4B7E" stroke-width="2" />
    <rect x="15" y="45" width="40" height="60" rx="2" fill="#0F172A" stroke="#F5A623" stroke-width="1" />
    <text x="35" y="78" fill="#F5A623" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BESS</text>
    <!-- Cooling Louvers -->
    <line x1="75" y1="50" x2="145" y2="50" stroke="#64748B" stroke-width="2" />
    <line x1="75" y1="60" x2="145" y2="60" stroke="#64748B" stroke-width="2" />
    <line x1="75" y1="70" x2="145" y2="70" stroke="#64748B" stroke-width="2" />
    <line x1="75" y1="80" x2="145" y2="80" stroke="#64748B" stroke-width="2" />
    <line x1="75" y1="90" x2="145" y2="90" stroke="#64748B" stroke-width="2" />

    <!-- Step-Up Power Transformer 2 -->
    <g transform="translate(190, 20)">
      <rect x="0" y="30" width="100" height="75" rx="4" fill="#334155" stroke="#E2E8F0" stroke-width="2" />
      <!-- HV Bushings -->
      <line x1="20" y1="30" x2="20" y2="5" stroke="#F5A623" stroke-width="3.5" />
      <line x1="50" y1="30" x2="50" y2="5" stroke="#F5A623" stroke-width="3.5" />
      <line x1="80" y1="30" x2="80" y2="5" stroke="#F5A623" stroke-width="3.5" />
      <circle cx="20" cy="5" r="4" fill="#F5A623" filter="url(#powerGlow)" />
      <circle cx="50" cy="5" r="4" fill="#F5A623" filter="url(#powerGlow)" />
      <circle cx="80" cy="5" r="4" fill="#F5A623" filter="url(#powerGlow)" />
    </g>
  </g>

  <!-- Max Power Corporation Badge Overlay -->
  <g transform="translate(60, 60)">
    <rect width="360" height="60" rx="14" fill="#0A2540" stroke="#F5A623" stroke-width="2" />
    <circle cx="30" cy="30" r="12" fill="#F5A623" />
    <text x="54" y="27" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="bold">MAX POWER CORPORATION</text>
    <text x="54" y="44" fill="#F4F7FA" font-family="sans-serif" font-size="10.5">Renewable Energy · HV Substations · Power EPC · BESS</text>
  </g>
</svg>
