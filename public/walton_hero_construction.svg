<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="waltonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081B30" />
      <stop offset="60%" stop-color="#0E2A47" />
      <stop offset="100%" stop-color="#1A3C60" />
    </linearGradient>
    <linearGradient id="waltonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#DFC48B" />
      <stop offset="100%" stop-color="#A6823B" />
    </linearGradient>
    <linearGradient id="glassFacade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E2A47" stop-opacity="0.9" />
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Blue Architectural Sky -->
  <rect width="1200" height="675" fill="url(#waltonSky)" />

  <!-- Blueprint CAD / BIM Architectural Grid Lines -->
  <g opacity="0.1" stroke="#C5A059" stroke-width="1.5">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#071729" opacity="0.6">
    <rect x="180" y="240" width="80" height="260" />
    <rect x="280" y="200" width="110" height="300" />
    <rect x="420" y="160" width="130" height="340" />
    <rect x="850" y="220" width="100" height="280" />
    <rect x="980" y="180" width="120" height="320" />
  </g>

  <!-- Heavy Construction Tower Crane 1 (Left) -->
  <g transform="translate(240, 110)">
    <!-- Vertical Mast Lattice -->
    <line x1="40" y1="380" x2="40" y2="40" stroke="#C5A059" stroke-width="3" />
    <line x1="60" y1="380" x2="60" y2="40" stroke="#C5A059" stroke-width="3" />
    <!-- Diagonal Lattice Bracing -->
    <line x1="40" y1="380" x2="60" y2="350" stroke="#A6823B" stroke-width="1.5" />
    <line x1="60" y1="380" x2="40" y2="350" stroke="#A6823B" stroke-width="1.5" />
    <line x1="40" y1="350" x2="60" y2="300" stroke="#A6823B" stroke-width="1.5" />
    <line x1="60" y1="350" x2="40" y2="300" stroke="#A6823B" stroke-width="1.5" />
    <line x1="40" y1="300" x2="60" y2="240" stroke="#A6823B" stroke-width="1.5" />
    <line x1="60" y1="300" x2="40" y2="240" stroke="#A6823B" stroke-width="1.5" />
    <line x1="40" y1="240" x2="60" y2="180" stroke="#A6823B" stroke-width="1.5" />
    <line x1="60" y1="240" x2="40" y2="180" stroke="#A6823B" stroke-width="1.5" />
    <line x1="40" y1="180" x2="60" y2="110" stroke="#A6823B" stroke-width="1.5" />
    <line x1="60" y1="180" x2="40" y2="110" stroke="#A6823B" stroke-width="1.5" />
    <line x1="40" y1="110" x2="60" y2="40" stroke="#A6823B" stroke-width="1.5" />
    <line x1="60" y1="110" x2="40" y2="40" stroke="#A6823B" stroke-width="1.5" />
    <!-- Operator Cabin & Slewing Unit -->
    <rect x="30" y="30" width="30" height="25" rx="3" fill="#081B30" stroke="#C5A059" stroke-width="2" />
    <!-- Crane Jib Arm (Extending Right) -->
    <line x1="-80" y1="35" x2="260" y2="35" stroke="#C5A059" stroke-width="3" />
    <line x1="-80" y1="35" x2="50" y2="-15" stroke="#DFC48B" stroke-width="1.5" />
    <line x1="50" y1="-15" x2="260" y2="35" stroke="#DFC48B" stroke-width="1.5" />
    <!-- Hoist Cable & Heavy Hook -->
    <line x1="180" y1="35" x2="180" y2="160" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4, 3" />
    <polygon points="174,160 186,160 180,175" fill="#C5A059" />
  </g>

  <!-- Modern Commercial Mega-Tower Superstructure (Center Right) -->
  <g transform="translate(560, 100)">
    <!-- Tower Core with Glass Curtain Wall Grid -->
    <rect x="0" y="0" width="280" height="420" rx="6" fill="url(#glassFacade)" stroke="#C5A059" stroke-width="2.5" />
    <!-- Horizontal Floor Slabs (Every 25px) -->
    <g stroke="#DFC48B" stroke-width="1" opacity="0.6">
      <line x1="0" y1="35" x2="280" y2="35" />
      <line x1="0" y1="70" x2="280" y2="70" />
      <line x1="0" y1="105" x2="280" y2="105" />
      <line x1="0" y1="140" x2="280" y2="140" />
      <line x1="0" y1="175" x2="280" y2="175" />
      <line x1="0" y1="210" x2="280" y2="210" />
      <line x1="0" y1="245" x2="280" y2="245" />
      <line x1="0" y1="280" x2="280" y2="280" />
      <line x1="0" y1="315" x2="280" y2="315" />
      <line x1="0" y1="350" x2="280" y2="350" />
      <line x1="0" y1="385" x2="280" y2="385" />
    </g>
    <!-- Vertical Mullions -->
    <g stroke="#DFC48B" stroke-width="1" opacity="0.4">
      <line x1="50" y1="0" x2="50" y2="420" />
      <line x1="100" y1="0" x2="100" y2="420" />
      <line x1="150" y1="0" x2="150" y2="420" />
      <line x1="200" y1="0" x2="200" y2="420" />
      <line x1="240" y1="0" x2="240" y2="420" />
    </g>
    <!-- Top Crown Feature with Glowing Accent -->
    <polygon points="0,0 140,-45 280,0" fill="#081B30" stroke="#C5A059" stroke-width="2.5" />
    <circle cx="140" cy="-45" r="5" fill="#C5A059" filter="url(#goldGlow)" />
  </g>

  <!-- Civil Infrastructure Overpass / Bridge Deck (Foreground) -->
  <g transform="translate(0, 480)">
    <!-- Bridge Roadway Span -->
    <polygon points="0,40 1200,20 1200,80 0,100" fill="#0A1D33" stroke="#C5A059" stroke-width="2.5" />
    <!-- Concrete Pier Columns -->
    <rect x="200" y="85" width="50" height="110" rx="4" fill="#1E2E42" stroke="#64748B" stroke-width="2" />
    <rect x="520" y="75" width="50" height="120" rx="4" fill="#1E2E42" stroke="#64748B" stroke-width="2" />
    <rect x="840" y="65" width="50" height="130" rx="4" fill="#1E2E42" stroke="#64748B" stroke-width="2" />
    <!-- Road Surface Guard Rails & Lane Dividers -->
    <line x1="0" y1="65" x2="1200" y2="45" stroke="#DFC48B" stroke-width="3" stroke-dasharray="30, 15" />
  </g>

  <!-- Heavy Construction Equipment Silhouette (Foreground Left) -->
  <g transform="translate(80, 520)">
    <!-- Excavator Cabin & Tracks -->
    <rect x="20" y="40" width="80" height="40" rx="5" fill="#C5A059" />
    <rect x="10" y="70" width="100" height="20" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <!-- Hydraulic Boom & Arm -->
    <line x1="90" y1="50" x2="150" y2="10" stroke="#C5A059" stroke-width="8" stroke-linecap="round" />
    <line x1="150" y1="10" x2="180" y2="60" stroke="#C5A059" stroke-width="6" stroke-linecap="round" />
    <polygon points="175,60 195,55 185,75" fill="#1E293B" />
  </g>

  <!-- Top Floating Badge -->
  <g transform="translate(60, 50)">
    <rect width="450" height="65" rx="16" fill="#081B30" stroke="#C5A059" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#C5A059" />
    <text x="64" y="29" fill="#DFC48B" font-family="sans-serif" font-size="13" font-weight="bold">WALTON CONSULTANTS &amp; CONTRACTING</text>
    <text x="64" y="47" fill="#F4F7FA" font-family="sans-serif" font-size="10.5">Civil Engineering · Turnkey EPC · Industrial Infrastructure</text>
  </g>
</svg>
