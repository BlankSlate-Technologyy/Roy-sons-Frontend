<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyDairy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123B1D" />
      <stop offset="35%" stop-color="#1C522A" />
      <stop offset="100%" stop-color="#81C784" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <linearGradient id="grass1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="grass2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#0E3813" />
    </linearGradient>
    <filter id="dairyGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Alpine Morning Sunrise -->
  <rect width="1200" height="675" fill="url(#skyDairy)" />
  <circle cx="950" cy="180" r="140" fill="#FFD54F" opacity="0.25" filter="url(#dairyGlow)" />
  <circle cx="950" cy="180" r="60" fill="#FFFDF2" opacity="0.7" filter="url(#dairyGlow)" />

  <!-- Rolling Alpine Green Foothills -->
  <polygon points="0,320 220,180 500,260 800,150 1080,250 1200,200 1200,440 0,440" fill="#123B1D" opacity="0.85" />
  <polygon points="0,360 280,240 600,310 880,210 1140,280 1200,250 1200,480 0,480" fill="#1C522A" opacity="0.9" />

  <!-- Lush Green Pasture Terraces -->
  <path d="M-50,420 Q300,390 620,410 T1250,400 L1250,480 Q750,470 450,490 T-50,495 Z" fill="url(#grass1)" />
  <path d="M-50,485 Q350,460 700,480 T1250,470 L1250,675 L-50,675 Z" fill="url(#grass2)" />

  <!-- ─── Modern Dairy Farm Complex Structure (Center-Left) ─── -->
  <g transform="translate(180, 240)">
    <!-- Main Dairy Barn & Milking Center -->
    <polygon points="0,90 140,30 280,90 280,200 0,200" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <!-- Swiss Green Roof Accent -->
    <polygon points="-10,90 140,25 290,90" fill="#1C522A" stroke="#C5A059" stroke-width="2" />

    <!-- Ventilated Windows & Clean Air Openings -->
    <rect x="25" y="110" width="50" height="40" rx="4" fill="#E8F5E9" stroke="#1C522A" stroke-width="1.5" />
    <rect x="95" y="110" width="50" height="40" rx="4" fill="#E8F5E9" stroke="#1C522A" stroke-width="1.5" />
    <rect x="165" y="110" width="50" height="40" rx="4" fill="#E8F5E9" stroke="#1C522A" stroke-width="1.5" />

    <!-- Modern Large Dairy Door -->
    <rect x="100" y="155" width="80" height="45" rx="4" fill="#1C522A" stroke="#C5A059" stroke-width="2" />
    <line x1="140" y1="155" x2="140" y2="200" stroke="#C5A059" stroke-width="2" />

    <!-- Stainless Steel Milk Processing Silos & Tanks -->
    <g transform="translate(300, 30)">
      <!-- Silo 1 -->
      <rect x="0" y="30" width="55" height="140" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" />
      <ellipse cx="27" cy="30" rx="27" ry="10" fill="#E2E8F0" />
      <path d="M0,30 Q27,0 55,30 Z" fill="#C5A059" />
      <!-- Silo 2 -->
      <rect x="70" y="45" width="50" height="125" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" />
      <ellipse cx="95" cy="45" rx="25" ry="9" fill="#E2E8F0" />
      <path d="M70,45 Q95,15 120,45 Z" fill="#C5A059" />
      <!-- Cold Chain Pipes -->
      <line x1="-20" y1="120" x2="0" y2="120" stroke="#C5A059" stroke-width="5" />
      <line x1="55" y1="120" x2="70" y2="120" stroke="#C5A059" stroke-width="5" />
    </g>

    <!-- Solar Panels on Dairy Farm Roof -->
    <g transform="translate(30, 45)">
      <polygon points="0,25 45,10 90,25 45,40" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <polygon points="100,25 145,10 190,25 145,40" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    </g>
  </g>

  <!-- ─── Holstein-Friesian Dairy Herd on Pasture (Right Foreground) ─── -->
  <g transform="translate(680, 430) scale(0.95)">
    <!-- Prize Dairy Cow 1 -->
    <ellipse cx="140" cy="80" rx="70" ry="42" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
    <!-- Authentic Black Spots -->
    <path d="M100,60 Q130,50 140,75 Q125,95 105,80 Z" fill="#1E293B" />
    <path d="M160,65 Q190,55 195,85 Q175,98 155,80 Z" fill="#1E293B" />
    <!-- Head -->
    <ellipse cx="60" cy="60" rx="28" ry="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
    <ellipse cx="50" cy="55" rx="6" ry="12" fill="#1E293B" />
    <circle cx="52" cy="58" r="3" fill="#FFFFFF" />
    <circle cx="52" cy="58" r="1.5" fill="#000000" />
    <!-- Muzzle -->
    <ellipse cx="40" cy="65" rx="14" ry="10" fill="#FFCDD2" />
    <!-- Legs -->
    <rect x="95" y="115" width="12" height="45" rx="3" fill="#1E293B" />
    <rect x="125" y="115" width="12" height="45" rx="3" fill="#1E293B" />
    <rect x="165" y="115" width="12" height="45" rx="3" fill="#1E293B" />
    <rect x="195" y="115" width="12" height="45" rx="3" fill="#1E293B" />
  </g>

  <g transform="translate(940, 460) scale(0.75)">
    <!-- Dairy Cow 2 -->
    <ellipse cx="140" cy="80" rx="70" ry="42" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
    <path d="M115,55 Q145,50 140,80 Q120,95 110,75 Z" fill="#1E293B" />
    <ellipse cx="60" cy="60" rx="28" ry="20" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
    <ellipse cx="40" cy="65" rx="14" ry="10" fill="#FFCDD2" />
    <rect x="95" y="115" width="12" height="45" rx="3" fill="#1E293B" />
    <rect x="125" y="115" width="12" height="45" rx="3" fill="#1E293B" />
    <rect x="165" y="115" width="12" height="45" rx="3" fill="#1E293B" />
    <rect x="195" y="115" width="12" height="45" rx="3" fill="#1E293B" />
  </g>

  <!-- Swiss Farms Quality Badge HUD -->
  <g transform="translate(60, 60)">
    <rect width="320" height="60" rx="14" fill="#123B1D" stroke="#C5A059" stroke-width="2" />
    <circle cx="30" cy="30" r="12" fill="#C5A059" />
    <text x="54" y="27" fill="#FFD54F" font-family="sans-serif" font-size="12" font-weight="bold">SWISS FARMS DAIRY</text>
    <text x="54" y="44" fill="#FFFDF2" font-family="sans-serif" font-size="10.5">120M+ Liters Annual Pure Milk · 25K+ Livestock</text>
  </g>
</svg>
