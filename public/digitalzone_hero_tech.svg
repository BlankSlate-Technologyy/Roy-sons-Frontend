<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062242" />
      <stop offset="60%" stop-color="#0A3A6B" />
      <stop offset="100%" stop-color="#0E4B8B" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2D54" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#061B33" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonBlur">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Tech Background Canvas -->
  <rect width="1200" height="675" fill="url(#techBg)" />

  <!-- Circuit Board Data Trace Grid Overlay -->
  <g opacity="0.15" stroke="#00A8E8" stroke-width="1.5" fill="none">
    <path d="M0,120 H300 L360,180 H700 L760,120 H1200" />
    <path d="M0,260 H200 L250,210 H550 L600,260 H1200" />
    <path d="M0,450 H400 L460,510 H850 L900,450 H1200" />
    <path d="M0,580 H180 L220,540 H950 L1000,580 H1200" />
    <circle cx="360" cy="180" r="4" fill="#00A8E8" />
    <circle cx="700" cy="180" r="4" fill="#00A8E8" />
    <circle cx="250" cy="210" r="4" fill="#00A8E8" />
    <circle cx="550" cy="210" r="4" fill="#00A8E8" />
    <circle cx="460" cy="510" r="4" fill="#00A8E8" />
    <circle cx="850" cy="510" r="4" fill="#00A8E8" />
  </g>

  <!-- Cloud Datacenter Server Racks (Background Left) -->
  <g transform="translate(100, 140)">
    <!-- Server Rack 1 -->
    <rect x="0" y="0" width="130" height="380" rx="8" fill="#05162A" stroke="#00A8E8" stroke-width="2" />
    <!-- Server Blades -->
    <g fill="#0A2544" stroke="#1E4470" stroke-width="1">
      <rect x="10" y="20" width="110" height="35" rx="3" />
      <rect x="10" y="65" width="110" height="35" rx="3" />
      <rect x="10" y="110" width="110" height="35" rx="3" />
      <rect x="10" y="155" width="110" height="35" rx="3" />
      <rect x="10" y="200" width="110" height="35" rx="3" />
      <rect x="10" y="245" width="110" height="35" rx="3" />
      <rect x="10" y="290" width="110" height="35" rx="3" />
      <rect x="10" y="335" width="110" height="30" rx="3" />
    </g>
    <!-- Status LEDs -->
    <g fill="#00A8E8">
      <circle cx="105" cy="37" r="3" filter="url(#neonBlur)" />
      <circle cx="105" cy="82" r="3" filter="url(#neonBlur)" />
      <circle cx="105" cy="127" r="3" filter="url(#neonBlur)" />
      <circle cx="105" cy="172" r="3" filter="url(#neonBlur)" />
      <circle cx="105" cy="217" r="3" filter="url(#neonBlur)" />
      <circle cx="105" cy="262" r="3" filter="url(#neonBlur)" />
      <circle cx="105" cy="307" r="3" filter="url(#neonBlur)" />
    </g>
    <g fill="#10B981">
      <circle cx="95" cy="37" r="2.5" />
      <circle cx="95" cy="82" r="2.5" />
      <circle cx="95" cy="127" r="2.5" />
      <circle cx="95" cy="172" r="2.5" />
      <circle cx="95" cy="217" r="2.5" />
      <circle cx="95" cy="262" r="2.5" />
      <circle cx="95" cy="307" r="2.5" />
    </g>
  </g>

  <!-- Central Floating Enterprise AI & ERP Command Console -->
  <g transform="translate(320, 100)">
    <!-- Main Glass Screen -->
    <rect x="0" y="0" width="580" height="360" rx="16" fill="url(#screenGlass)" stroke="#00A8E8" stroke-width="2.5" filter="url(#neonBlur)" />
    <!-- Screen Header Bar -->
    <rect x="0" y="0" width="580" height="45" rx="16" fill="#0A3A6B" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold">DIGITAL ZONING // AI ENTERPRISE CLOUD ENGINE v4.8</text>

    <!-- Sub-Dashboard 1: Neural Network Visualizer (Left) -->
    <g transform="translate(25, 65)">
      <rect width="250" height="150" rx="10" fill="#051B33" stroke="#1E4470" stroke-width="1.5" />
      <text x="15" y="24" fill="#00A8E8" font-family="sans-serif" font-size="11" font-weight="bold">AI NEURAL INFERENCE ENGINE</text>
      <!-- Neural Nodes & Synapses -->
      <g stroke="#00A8E8" stroke-width="1.5" opacity="0.8">
        <line x1="40" y1="60" x2="110" y2="45" />
        <line x1="40" y1="60" x2="110" y2="90" />
        <line x1="40" y1="110" x2="110" y2="45" />
        <line x1="40" y1="110" x2="110" y2="90" />
        <line x1="40" y1="110" x2="110" y2="130" />
        <line x1="110" y1="45" x2="180" y2="65" />
        <line x1="110" y1="90" x2="180" y2="65" />
        <line x1="110" y1="90" x2="180" y2="115" />
        <line x1="110" y1="130" x2="180" y2="115" />
        <line x1="180" y1="65" x2="225" y2="85" />
        <line x1="180" y1="115" x2="225" y2="85" />
      </g>
      <!-- Node Circles -->
      <circle cx="40" cy="60" r="7" fill="#00A8E8" />
      <circle cx="40" cy="110" r="7" fill="#00A8E8" />
      <circle cx="110" cy="45" r="7" fill="#38BDF8" />
      <circle cx="110" cy="90" r="7" fill="#38BDF8" />
      <circle cx="110" cy="130" r="7" fill="#38BDF8" />
      <circle cx="180" cy="65" r="7" fill="#00A8E8" />
      <circle cx="180" cy="115" r="7" fill="#00A8E8" />
      <circle cx="225" cy="85" r="8" fill="#10B981" />
    </g>

    <!-- Sub-Dashboard 2: Real-time ERP Telemetry & Analytics (Right) -->
    <g transform="translate(300, 65)">
      <rect width="255" height="150" rx="10" fill="#051B33" stroke="#1E4470" stroke-width="1.5" />
      <text x="15" y="24" fill="#00A8E8" font-family="sans-serif" font-size="11" font-weight="bold">ENTERPRISE ERP DATA MESH</text>
      <!-- Bar Charts -->
      <rect x="25" y="100" width="22" height="35" rx="3" fill="#00A8E8" />
      <rect x="55" y="80" width="22" height="55" rx="3" fill="#00A8E8" />
      <rect x="85" y="55" width="22" height="80" rx="3" fill="#38BDF8" />
      <rect x="115" y="40" width="22" height="95" rx="3" fill="#00A8E8" />
      <rect x="145" y="65" width="22" height="70" rx="3" fill="#00A8E8" />
      <rect x="175" y="30" width="22" height="105" rx="3" fill="#10B981" />
      <rect x="205" y="45" width="22" height="90" rx="3" fill="#38BDF8" />
    </g>

    <!-- Bottom Code Terminal & Kubernetes Status -->
    <g transform="translate(25, 230)">
      <rect width="530" height="105" rx="10" fill="#031122" stroke="#1E4470" stroke-width="1.5" />
      <text x="15" y="24" fill="#38BDF8" font-family="monospace" font-size="11">&gt; cluster.deploy(service=&quot;ai-pipeline-v4&quot;, replicas=12, status=&quot;HEALTHY_ACTIVE&quot;)</text>
      <text x="15" y="45" fill="#10B981" font-family="monospace" font-size="11">&gt; zero_trust_mesh.verify_handshake(nodes=150, latency=&quot;0.8ms&quot;, cert=&quot;MUTUAL_TLS_v1.3&quot;)</text>
      <text x="15" y="66" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; cloud_storage.sync(region=&quot;global-multi-cloud&quot;, encryption=&quot;AES-256-GCM&quot;)</text>
      <text x="15" y="88" fill="#F59E0B" font-family="monospace" font-size="11">&gt; [OK] SYSTEM 99.99% UPTIME // ALL 12 ENTERPRISE CLUSTERS OPERATIONAL</text>
    </g>
  </g>

  <!-- Right Floating Cybersecurity Zero-Trust Shield -->
  <g transform="translate(950, 180)">
    <polygon points="90,0 180,35 180,130 90,210 0,130 0,35" fill="#051930" stroke="#00A8E8" stroke-width="3" filter="url(#neonBlur)" />
    <!-- Inner Shield Accent -->
    <polygon points="90,20 160,50 160,120 90,185 20,120 20,50" fill="#0A3A6B" opacity="0.6" />
    <!-- Lock / Security Core Icon -->
    <rect x="70" y="90" width="40" height="35" rx="5" fill="#00A8E8" />
    <path d="M78,90 V75 A12,12 0 0,1 102,75 V90" stroke="#00A8E8" stroke-width="4" fill="none" />
    <circle cx="90" cy="107" r="4" fill="#051930" />
    <text x="90" y="150" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ZERO-TRUST</text>
    <text x="90" y="165" fill="#00A8E8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SOC-2 COMPLIANT</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="460" height="65" rx="16" fill="#05182E" stroke="#00A8E8" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#00A8E8" />
    <text x="64" y="29" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="bold">DIGITAL ZONING CORPORATION</text>
    <text x="64" y="47" fill="#F4F8FC" font-family="sans-serif" font-size="10.5">Enterprise AI · Custom ERP Platforms · Cloud &amp; Cyber Defense</text>
  </g>
</svg>
