<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skySwiss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B01B2E" />
      <stop offset="100%" stop-color="#E53935" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="villaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Twilight Sky -->
  <rect width="1200" height="675" fill="url(#skySwiss)" />

  <!-- Alpine Mountain Silhouette Foothills -->
  <polygon points="0,380 180,240 380,320 620,180 880,290 1080,220 1200,270 1200,480 0,480" fill="#0F172A" opacity="0.9" />
  <polygon points="0,420 220,310 480,370 750,260 980,340 1200,290 1200,500 0,500" fill="#1E293B" opacity="0.8" />

  <!-- Landscaped Terrace & Ground -->
  <rect x="0" y="470" width="1200" height="205" fill="#0F172A" />
  <!-- Green Lawn Area -->
  <path d="M0,500 Q300,480 600,490 T1200,485 L1200,675 L0,675 Z" fill="#14532D" />

  <!-- ─── Modern Swiss Architectural Luxury Villa ─── -->
  <g transform="translate(240, 160)">
    <!-- Villa Main Ground Floor Concrete Structure -->
    <rect x="100" y="180" width="560" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <!-- Concrete Texture Accent Wall (Dark Charcoal) -->
    <rect x="100" y="180" width="120" height="170" fill="#334155" />
    <line x1="120" y1="180" x2="120" y2="350" stroke="#475569" stroke-width="1.5" />
    <line x1="150" y1="180" x2="150" y2="350" stroke="#475569" stroke-width="1.5" />
    <line x1="180" y1="180" x2="180" y2="350" stroke="#475569" stroke-width="1.5" />

    <!-- Floor-to-Ceiling Ground Floor Glass Windows with Warm Interior Glow -->
    <rect x="235" y="200" width="180" height="145" rx="4" fill="url(#warmLight)" stroke="#0F172A" stroke-width="2" />
    <line x1="325" y1="200" x2="325" y2="345" stroke="#0F172A" stroke-width="2" />
    <rect x="430" y="200" width="215" height="145" rx="4" fill="url(#warmLight)" stroke="#0F172A" stroke-width="2" />
    <line x1="535" y1="200" x2="535" y2="345" stroke="#0F172A" stroke-width="2" />

    <!-- Modern Cantilevered First Floor Box Structure (Swiss Minimalist) -->
    <rect x="140" y="40" width="460" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
    <!-- Swiss Red Signature Architectural Accent Fin -->
    <rect x="140" y="30" width="16" height="170" rx="4" fill="url(#redAccent)" filter="url(#villaGlow)" />
    <rect x="584" y="30" width="16" height="170" rx="4" fill="url(#redAccent)" />

    <!-- Upper Floor Panoramic Glass Wall & Balcony -->
    <rect x="180" y="60" width="220" height="110" rx="4" fill="url(#warmLight)" stroke="#0F172A" stroke-width="2" />
    <rect x="420" y="60" width="150" height="110" rx="4" fill="url(#warmLight)" stroke="#0F172A" stroke-width="2" />
    
    <!-- Glass Balustrade (Tempered Railing) -->
    <rect x="160" y="135" width="420" height="45" rx="4" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="160" y1="135" x2="580" y2="135" stroke="#B01B2E" stroke-width="3" />

    <!-- Modern Pergola & Roof Trellis -->
    <rect x="120" y="20" width="500" height="15" rx="4" fill="#0F172A" />
    <line x1="180" y1="5" x2="180" y2="20" stroke="#0F172A" stroke-width="4" />
    <line x1="260" y1="5" x2="260" y2="20" stroke="#0F172A" stroke-width="4" />
    <line x1="340" y1="5" x2="340" y2="20" stroke="#0F172A" stroke-width="4" />
    <line x1="420" y1="5" x2="420" y2="20" stroke="#0F172A" stroke-width="4" />
    <line x1="500" y1="5" x2="500" y2="20" stroke="#0F172A" stroke-width="4" />
    <line x1="580" y1="5" x2="580" y2="20" stroke="#0F172A" stroke-width="4" />

    <!-- Warm Exterior Downlights -->
    <circle cx="200" cy="190" r="4" fill="#FFD54F" filter="url(#villaGlow)" />
    <polygon points="195,190 170,250 230,250" fill="#FFD54F" opacity="0.15" />
    <circle cx="430" cy="190" r="4" fill="#FFD54F" filter="url(#villaGlow)" />
    <polygon points="425,190 400,250 460,250" fill="#FFD54F" opacity="0.15" />
    <circle cx="630" cy="190" r="4" fill="#FFD54F" filter="url(#villaGlow)" />
    <polygon points="625,190 600,250 660,250" fill="#FFD54F" opacity="0.15" />
  </g>

  <!-- Luxury Infinity Swimming Pool (Foreground) -->
  <g transform="translate(320, 520)">
    <polygon points="0,20 480,20 540,100 60,100" fill="url(#poolWater)" stroke="#38BDF8" stroke-width="2" />
    <!-- Pool Water Reflections -->
    <path d="M40,45 Q160,35 280,45 T500,45" stroke="#E0F2FE" stroke-width="2" opacity="0.7" fill="none" />
    <path d="M70,70 Q200,60 340,70 T480,70" stroke="#E0F2FE" stroke-width="2" opacity="0.6" fill="none" />
    <!-- Pool Deck Tiles -->
    <rect x="-40" y="15" width="40" height="85" fill="#E2E8F0" />
    <rect x="540" y="15" width="50" height="85" fill="#E2E8F0" />
  </g>

  <!-- Swiss Homes Luxury Badge (HUD Overlay) -->
  <g transform="translate(60, 60)">
    <rect width="320" height="60" rx="14" fill="#1A1A1A" stroke="#B01B2E" stroke-width="2" />
    <!-- Swiss Cross in Red Shield -->
    <rect x="18" y="14" width="32" height="32" rx="8" fill="#B01B2E" />
    <rect x="30" y="20" width="8" height="20" fill="#FFFFFF" />
    <rect x="24" y="26" width="20" height="8" fill="#FFFFFF" />
    <text x="62" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">SWISS HOMES DEVELOPMENT</text>
    <text x="62" y="44" fill="#CBD5E1" font-family="sans-serif" font-size="10.5">Luxury Smart Communities &amp; Villas</text>
  </g>
</svg>
