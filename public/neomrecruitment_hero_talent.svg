<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="talentSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152B" />
      <stop offset="50%" stop-color="#0F2B5B" />
      <stop offset="100%" stop-color="#184384" />
    </linearGradient>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="50%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="recruitmentGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123164" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#081A36" stop-opacity="0.9" />
    </linearGradient>
    <filter id="talentGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Corporate Navy Background -->
  <rect width="1200" height="675" fill="url(#talentSky)" />

  <!-- Global Talent Mobility & Flight Trajectory Coordinates -->
  <g opacity="0.15" stroke="#00A896" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Corporate Towers & International Airport Silhouettes -->
  <g fill="#06162D" opacity="0.6">
    <rect x="80" y="240" width="80" height="260" rx="4" />
    <rect x="180" y="190" width="90" height="310" rx="4" />
    <rect x="290" y="270" width="70" height="230" rx="4" />
    <rect x="840" y="220" width="80" height="280" rx="4" />
    <rect x="940" y="180" width="100" height="320" rx="4" />
    <rect x="1060" y="250" width="70" height="250" rx="4" />
  </g>

  <!-- Central AI Talent Matching & Overseas Deployment Console -->
  <g transform="translate(300, 100)">
    <!-- Main Board Glass Screen -->
    <rect x="0" y="0" width="600" height="370" rx="16" fill="url(#recruitmentGlass)" stroke="#00A896" stroke-width="2.5" filter="url(#talentGlow)" />
    <!-- Header Bar -->
    <rect x="0" y="0" width="600" height="45" rx="16" fill="#091E3F" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#00A896" font-family="sans-serif" font-size="12" font-weight="bold">NEOM CITY RECRUITMENT // GLOBAL TALENT ACQUISITION &amp; DEPLOYMENT</text>

    <!-- Sub-Dashboard 1: Executive Search Pipeline & Assessment (Left) -->
    <g transform="translate(25, 65)">
      <rect width="260" height="155" rx="10" fill="#06162D" stroke="#0072CE" stroke-width="1.5" />
      <text x="15" y="24" fill="#00A896" font-family="sans-serif" font-size="11" font-weight="bold">TALENT PIPELINE MATCHING (%)</text>
      <!-- Pipeline Bar Chart -->
      <g transform="translate(15, 38)">
        <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="9">C-Suite / Executives</text>
        <rect x="110" y="3" width="105" height="12" rx="3" fill="#0072CE" />
        <text x="225" y="13" fill="#00A896" font-family="sans-serif" font-size="9" font-weight="bold">94%</text>
        
        <text x="0" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="9">Civil / Mega-Project Eng</text>
        <rect x="110" y="25" width="125" height="12" rx="3" fill="#00A896" />
        <text x="240" y="35" fill="#00A896" font-family="sans-serif" font-size="9" font-weight="bold">98%</text>

        <text x="0" y="56" fill="#E2E8F0" font-family="sans-serif" font-size="9">Healthcare Consultants</text>
        <rect x="110" y="47" width="115" height="12" rx="3" fill="#38BDF8" />
        <text x="230" y="57" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">96%</text>

        <text x="0" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="9">IT / AI / Cyber Security</text>
        <rect x="110" y="69" width="120" height="12" rx="3" fill="#10B981" />
        <text x="235" y="79" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">97%</text>
      </g>
    </g>

    <!-- Sub-Dashboard 2: Global Placement Destination Radar (Right) -->
    <g transform="translate(310, 65)">
      <rect width="265" height="155" rx="10" fill="#06162D" stroke="#0072CE" stroke-width="1.5" />
      <text x="15" y="24" fill="#00A896" font-family="sans-serif" font-size="11" font-weight="bold">OVERSEAS DEPLOYMENT HUBS</text>
      <!-- Regional Telemetry Stats -->
      <g transform="translate(15, 42)">
        <circle cx="20" cy="20" r="16" fill="#0F2B5B" stroke="#0072CE" stroke-width="1.5" />
        <text x="20" y="24" fill="#00A896" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">KSA</text>
        <text x="45" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">Saudi Arabia / NEOM</text>
        <text x="45" y="32" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Mega-City &amp; Energy Infra</text>

        <circle cx="20" cy="65" r="16" fill="#0F2B5B" stroke="#00A896" stroke-width="1.5" />
        <text x="20" y="69" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">UAE</text>
        <text x="45" y="63" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">United Arab Emirates</text>
        <text x="45" y="77" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Finance, Tech &amp; Aviation</text>
      </g>
    </g>

    <!-- Bottom Talent Telemetry Log -->
    <g transform="translate(25, 235)">
      <rect width="550" height="115" rx="10" fill="#040F1F" stroke="#0072CE" stroke-width="1.5" />
      <text x="15" y="25" fill="#00A896" font-family="monospace" font-size="11">&gt; talent_engine.match_candidate(role=&quot;Senior Infrastructure Lead&quot;, score=&quot;99.2%&quot;)</text>
      <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">&gt; overseas_visa_gateway.verify_credentials(status=&quot;ATTESTED_PASSED&quot;)</text>
      <text x="15" y="71" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; payroll_compliance.audit_ilo_standards(ethical_hiring=&quot;100% VERIFIED&quot;)</text>
      <text x="15" y="94" fill="#38BDF8" font-family="monospace" font-size="11">&gt; [OK] 50,000+ GLOBAL WORKFORCE PLACEMENTS DELIVERED // 2,000+ CORPORATE CLIENTS</text>
    </g>
  </g>

  <!-- Left Floating ISO 9001 & ILO Ethical Recruitment Badge -->
  <g transform="translate(90, 180)">
    <rect width="180" height="240" rx="16" fill="#0C234B" stroke="#00A896" stroke-width="2" filter="url(#talentGlow)" />
    <!-- Users & Shield Graphic -->
    <g transform="translate(90, 80)">
      <circle cx="0" cy="-12" r="14" fill="#0072CE" />
      <path d="M-22,18 C-22,4 -12,2 0,2 C12,2 22,4 22,18 Z" fill="#00A896" />
      <!-- Star / Award -->
      <polygon points="0,-32 4,-24 12,-24 6,-18 8,-10 0,-15 -8,-10 -6,-18 -12,-24 -4,-24" fill="#38BDF8" />
    </g>
    <text x="90" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">50,000+ TALENT</text>
    <text x="90" y="182" fill="#00A896" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">PLACEMENTS MADE</text>
    <text x="90" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">ILO Ethical Standards</text>
  </g>

  <!-- Right Floating 2,000+ Corporate Clients Emblem -->
  <g transform="translate(930, 180)">
    <rect width="190" height="240" rx="16" fill="#0C234B" stroke="#00A896" stroke-width="2" filter="url(#talentGlow)" />
    <!-- Briefcase / Globe Emblem -->
    <g transform="translate(95, 80)">
      <circle cx="0" cy="0" r="26" fill="#0F2B5B" stroke="#0072CE" stroke-width="2" />
      <rect x="-14" y="-8" width="28" height="20" rx="3" fill="#00A896" />
      <path d="M-7,-8 L-7,-13 C-7,-15 7,-15 7,-13 L7,-8" fill="none" stroke="#E2E8F0" stroke-width="2" />
      <line x1="-14" y1="2" x2="14" y2="2" stroke="#0F2B5B" stroke-width="1.5" />
    </g>
    <text x="95" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2,000+ CLIENTS</text>
    <text x="95" y="182" fill="#00A896" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">CORPORATE PARTNERS</text>
    <text x="95" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">GCC, UK, EU &amp; Asia</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="520" height="65" rx="16" fill="#0C234B" stroke="#00A896" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#0072CE" />
    <text x="64" y="29" fill="#00A896" font-family="sans-serif" font-size="13" font-weight="bold">NEOM CITY RECRUITMENT CONSULTANTS</text>
    <text x="64" y="47" fill="#F8FAFC" font-family="sans-serif" font-size="10.5">Executive Search · Overseas Workforce · Talent Acquisition &amp; HR Advisory</text>
  </g>
</svg>
