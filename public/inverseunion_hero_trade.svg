<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tradeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A33" />
      <stop offset="50%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#133D6D" />
    </linearGradient>
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="50%" stop-color="#00D2C8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="tradeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2D52" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06162A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="tradeGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Smart Navy Sky Background -->
  <rect width="1200" height="675" fill="url(#tradeSky)" />

  <!-- Global Maritime & Air Cargo Shipping Route Coordinates Overlay -->
  <g opacity="0.15" stroke="#00D2C8" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Container Port Cranes & Cargo Ships Silhouettes -->
  <g fill="#051426" opacity="0.6">
    <polygon points="100,500 100,280 180,240 260,280 260,500" />
    <rect x="280" y="200" width="100" height="300" rx="4" />
    <polygon points="850,500 850,220 930,170 1010,220 1010,500" />
    <rect x="1030" y="240" width="90" height="260" rx="4" />
  </g>

  <!-- Central International Trade & Procurement Telemetry Console -->
  <g transform="translate(300, 100)">
    <!-- Main Board Glass Screen -->
    <rect x="0" y="0" width="600" height="370" rx="16" fill="url(#tradeGlass)" stroke="#00D2C8" stroke-width="2.5" filter="url(#tradeGlow)" />
    <!-- Header Bar -->
    <rect x="0" y="0" width="600" height="45" rx="16" fill="#07192F" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#00D2C8" font-family="sans-serif" font-size="12" font-weight="bold">INVERSE &amp; UNION TRADING // GLOBAL SUPPLY CHAIN TELEMETRY</text>

    <!-- Sub-Dashboard 1: Global Shipping Vessel Tracking (Left) -->
    <g transform="translate(25, 65)">
      <rect width="260" height="155" rx="10" fill="#051424" stroke="#0080FF" stroke-width="1.5" />
      <text x="15" y="24" fill="#00D2C8" font-family="sans-serif" font-size="11" font-weight="bold">GLOBAL FREIGHT LOGISTICS (TEU)</text>
      <!-- Shipping Volume Line -->
      <line x1="25" y1="130" x2="235" y2="130" stroke="#133D6D" stroke-width="1" />
      <line x1="25" y1="40" x2="25" y2="130" stroke="#133D6D" stroke-width="1" />
      <!-- Multi-modal trend curve -->
      <polygon points="25,120 60,85 100,95 140,60 180,45 225,35 225,130 25,130" fill="#0080FF" fill-opacity="0.25" />
      <polyline points="25,120 60,85 100,95 140,60 180,45 225,35" fill="none" stroke="#00D2C8" stroke-width="2.5" />
      <circle cx="60" cy="85" r="3.5" fill="#00D2C8" />
      <circle cx="100" cy="95" r="3.5" fill="#00D2C8" />
      <circle cx="140" cy="60" r="3.5" fill="#00D2C8" />
      <circle cx="180" cy="45" r="3.5" fill="#00D2C8" />
      <circle cx="225" cy="35" r="5" fill="#38BDF8" />
      <text x="145" y="30" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">99.4% ON-TIME</text>
    </g>

    <!-- Sub-Dashboard 2: Trade Commodities & Customs Clearance (Right) -->
    <g transform="translate(310, 65)">
      <rect width="265" height="155" rx="10" fill="#051424" stroke="#0080FF" stroke-width="1.5" />
      <text x="15" y="24" fill="#00D2C8" font-family="sans-serif" font-size="11" font-weight="bold">PROCUREMENT SECTORS DISPATCH</text>
      <!-- Telemetry Bars -->
      <g transform="translate(15, 38)">
        <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="9">Industrial Heavy</text>
        <rect x="95" y="3" width="120" height="12" rx="3" fill="#0080FF" />
        <text x="225" y="13" fill="#00D2C8" font-family="sans-serif" font-size="9" font-weight="bold">42%</text>
        
        <text x="0" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="9">Raw Minerals</text>
        <rect x="95" y="25" width="95" height="12" rx="3" fill="#00D2C8" />
        <text x="200" y="35" fill="#00D2C8" font-family="sans-serif" font-size="9" font-weight="bold">28%</text>

        <text x="0" y="56" fill="#E2E8F0" font-family="sans-serif" font-size="9">Agri-Commodities</text>
        <rect x="95" y="47" width="110" height="12" rx="3" fill="#10B981" />
        <text x="215" y="57" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">18%</text>

        <text x="0" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="9">Energy &amp; Power</text>
        <rect x="95" y="69" width="85" height="12" rx="3" fill="#F59E0B" />
        <text x="190" y="79" fill="#F59E0B" font-family="sans-serif" font-size="9" font-weight="bold">12%</text>
      </g>
    </g>

    <!-- Bottom Trade Telemetry Log -->
    <g transform="translate(25, 235)">
      <rect width="550" height="115" rx="10" fill="#030C16" stroke="#0080FF" stroke-width="1.5" />
      <text x="15" y="25" fill="#00D2C8" font-family="monospace" font-size="11">&gt; inverse_trade.route_shipment(origin=&quot;Shanghai_CN&quot;, dest=&quot;Karachi_PK&quot;, status=&quot;CLEARED&quot;)</text>
      <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">&gt; customs_declarations.verify_hscode(tariff=&quot;8471.30&quot;, duty=&quot;OPTIMIZED_0%&quot;)</text>
      <text x="15" y="71" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; incoterms_2020.audit_contract(terms=&quot;FOB/CIF/DDP&quot;, compliance=&quot;100% VERIFIED&quot;)</text>
      <text x="15" y="94" fill="#38BDF8" font-family="monospace" font-size="11">&gt; [OK] 5,000+ TRADE CONTRACTS EXECUTED ACROSS 40+ COUNTRIES NATIONWIDE</text>
    </g>
  </g>

  <!-- Left Floating Incoterms 2020 & Compliance Badge -->
  <g transform="translate(90, 180)">
    <rect width="180" height="240" rx="16" fill="#091F38" stroke="#00D2C8" stroke-width="2" filter="url(#tradeGlow)" />
    <!-- Cargo Ship & Shield Icon -->
    <g transform="translate(90, 80)">
      <!-- Ship Hull -->
      <polygon points="-25,10 25,10 18,25 -18,25" fill="#0080FF" />
      <!-- Superstructure -->
      <rect x="-10" y="-8" width="20" height="18" fill="#00D2C8" />
      <!-- Stack -->
      <rect x="2" y="-18" width="4" height="10" fill="#38BDF8" />
      <!-- Containers on deck -->
      <rect x="-20" y="2" width="8" height="8" fill="#10B981" />
      <rect x="-10" y="2" width="8" height="8" fill="#F59E0B" />
      <rect x="0" y="2" width="8" height="8" fill="#EF4444" />
      <rect x="10" y="2" width="8" height="8" fill="#38BDF8" />
    </g>
    <text x="90" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INCOTERMS 2020</text>
    <text x="90" y="182" fill="#00D2C8" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">GLOBAL COMPLIANT</text>
    <text x="90" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Customs Bonded Logistics</text>
  </g>

  <!-- Right Floating 40+ Countries Trade Emblem -->
  <g transform="translate(930, 180)">
    <rect width="190" height="240" rx="16" fill="#091F38" stroke="#00D2C8" stroke-width="2" filter="url(#tradeGlow)" />
    <!-- Globe / Network Icon -->
    <g transform="translate(95, 80)">
      <circle cx="0" cy="0" r="26" fill="#0B2545" stroke="#00D2C8" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#0080FF" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="12" ry="26" fill="none" stroke="#0080FF" stroke-width="1.5" />
      <circle cx="-12" cy="-8" r="3.5" fill="#00D2C8" />
      <circle cx="12" cy="8" r="3.5" fill="#00D2C8" />
    </g>
    <text x="95" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">40+ COUNTRIES</text>
    <text x="95" y="182" fill="#00D2C8" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">GLOBAL SOURCING</text>
    <text x="95" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">5,000+ Trade Contracts</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="470" height="65" rx="16" fill="#091F38" stroke="#00D2C8" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#0080FF" />
    <text x="64" y="29" fill="#00D2C8" font-family="sans-serif" font-size="13" font-weight="bold">INVERSE &amp; UNION TRADING</text>
    <text x="64" y="47" fill="#F8FAFC" font-family="sans-serif" font-size="10.5">Global Procurement · Import/Export · Supply Chain Management</text>
  </g>
</svg>
