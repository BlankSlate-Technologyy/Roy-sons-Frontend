<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="skyAgri" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B4D3E" />
      <stop offset="40%" stop-color="#2D7A4F" />
      <stop offset="100%" stop-color="#88C08A" />
    </linearGradient>
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A800" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E8A800" />
    </linearGradient>
    <linearGradient id="greenField1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="greenField2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="50%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <filter id="glowAgri" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyAgri)" />

  <!-- Radiant Golden Morning Sun -->
  <circle cx="1000" cy="160" r="130" fill="#FFD700" opacity="0.25" filter="url(#glowAgri)" />
  <circle cx="1000" cy="160" r="60" fill="#FFFDF2" opacity="0.6" filter="url(#glowAgri)" />

  <!-- Background Mountain & Rolling Green Foothills -->
  <polygon points="0,320 240,190 520,280 820,160 1080,270 1200,210 1200,440 0,440" fill="#1B4D3E" opacity="0.8" />
  <polygon points="0,360 300,260 620,330 890,220 1140,300 1200,270 1200,480 0,480" fill="#2E7D32" opacity="0.9" />

  <!-- Farmland Terraces & Contours -->
  <!-- Level 1 Farmland -->
  <path d="M-50,410 Q320,380 650,400 T1250,390 L1250,460 Q800,450 500,465 T-50,470 Z" fill="url(#greenField1)" />
  <!-- Golden Wheat Field Swathe -->
  <path d="M0,455 Q350,430 700,450 T1250,440 L1250,520 Q750,510 450,530 T-50,535 Z" fill="url(#wheatGold)" opacity="0.95" />
  
  <!-- High-Tech Center-Pivot Irrigation Sprinkler System -->
  <g transform="translate(680, 360)">
    <line x1="0" y1="0" x2="260" y2="25" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#E8A800" stroke="#FFFFFF" stroke-width="2" />
    <!-- Pivot Towers -->
    <line x1="65" y1="6" x2="65" y2="40" stroke="#FFFFFF" stroke-width="2" />
    <line x1="130" y1="12" x2="130" y2="50" stroke="#FFFFFF" stroke-width="2" />
    <line x1="195" y1="18" x2="195" y2="60" stroke="#FFFFFF" stroke-width="2" />
    <line x1="260" y1="25" x2="260" y2="70" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Fine Water Mist Spray -->
    <path d="M65,40 Q65,65 50,75 M65,40 Q65,65 80,75" stroke="#80D8FF" stroke-width="1.5" opacity="0.7" />
    <path d="M130,50 Q130,75 115,85 M130,50 Q130,75 145,85" stroke="#80D8FF" stroke-width="1.5" opacity="0.7" />
    <path d="M195,60 Q195,85 180,95 M195,60 Q195,85 210,95" stroke="#80D8FF" stroke-width="1.5" opacity="0.7" />
    <path d="M260,70 Q260,95 245,105 M260,70 Q260,95 275,105" stroke="#80D8FF" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Level 3 Deep Emerald Crop Lines -->
  <path d="M-50,520 Q300,500 620,520 T1250,510 L1250,600 Q700,590 400,605 T-50,610 Z" fill="url(#greenField2)" />
  
  <!-- Perspective Crop Rows (Smart Farming Furrows) -->
  <g stroke="#1B5E20" stroke-width="2" opacity="0.6">
    <line x1="100" y1="525" x2="20" y2="675" />
    <line x1="220" y1="525" x2="160" y2="675" />
    <line x1="340" y1="525" x2="300" y2="675" />
    <line x1="460" y1="525" x2="450" y2="675" />
    <line x1="580" y1="525" x2="600" y2="675" />
    <line x1="700" y1="525" x2="750" y2="675" />
    <line x1="820" y1="525" x2="900" y2="675" />
    <line x1="940" y1="525" x2="1050" y2="675" />
  </g>

  <!-- Foreground Smart Heavy Tractor (Vector Stylized) -->
  <g transform="translate(180, 480) scale(0.85)">
    <!-- Body Chassis -->
    <rect x="30" y="30" width="70" height="40" rx="6" fill="#1B5E20" stroke="#E8A800" stroke-width="2" />
    <rect x="65" y="15" width="40" height="35" rx="4" fill="#FFFFFF" opacity="0.9" stroke="#1B5E20" stroke-width="2" />
    <rect x="70" y="20" width="30" height="20" rx="2" fill="#80D8FF" opacity="0.7" />
    <rect x="15" y="38" width="25" height="30" rx="4" fill="#2E7D32" />
    <!-- Giant Rear Wheel -->
    <circle cx="85" cy="75" r="26" fill="#111827" stroke="#E8A800" stroke-width="3" />
    <circle cx="85" cy="75" r="14" fill="#E8A800" />
    <!-- Front Wheel -->
    <circle cx="25" cy="80" r="16" fill="#111827" stroke="#E8A800" stroke-width="2.5" />
    <circle cx="25" cy="80" r="8" fill="#E8A800" />
    <!-- Exhaust & GPS Antenna -->
    <line x1="35" y1="15" x2="35" y2="35" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <circle cx="95" cy="10" r="4" fill="#FFD700" />
    <line x1="95" y1="10" x2="95" y2="15" stroke="#FFD700" stroke-width="2" />
  </g>

  <!-- Modern Dairy Facility Silos (Right Background) -->
  <g transform="translate(980, 360) scale(0.7)">
    <rect x="0" y="20" width="45" height="90" rx="6" fill="#FFFFFF" stroke="#D4E8D0" stroke-width="2" />
    <path d="M0,20 Q22,0 45,20 Z" fill="#E8A800" />
    <rect x="55" y="30" width="40" height="80" rx="6" fill="#FFFFFF" stroke="#D4E8D0" stroke-width="2" />
    <path d="M55,30 Q75,10 95,30 Z" fill="#E8A800" />
    <!-- Modern Barn -->
    <polygon points="105,60 170,30 235,60 235,110 105,110" fill="#1B5E20" stroke="#FFFFFF" stroke-width="2" />
    <rect x="150" y="75" width="40" height="35" fill="#FFFFFF" />
  </g>

  <!-- Agritech Telemetry HUD -->
  <g transform="translate(820, 80)" opacity="0.85">
    <rect width="320" height="60" rx="12" fill="#1B4D3E" stroke="#E8A800" stroke-width="1.5" />
    <circle cx="30" cy="30" r="10" fill="#E8A800" />
    <text x="50" y="26" fill="#FFD700" font-family="sans-serif" font-size="12" font-weight="bold">SMART AGRICULTURE &amp; DAIRY</text>
    <text x="50" y="44" fill="#FFFDF2" font-family="sans-serif" font-size="11">1M+ Acres Supported · Precision Irrigation</text>
  </g>
</svg>
