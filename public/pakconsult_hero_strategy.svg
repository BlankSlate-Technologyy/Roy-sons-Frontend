<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="consultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252C34" />
      <stop offset="60%" stop-color="#3A444E" />
      <stop offset="100%" stop-color="#4F5963" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#DFC48B" />
      <stop offset="100%" stop-color="#A6823B" />
    </linearGradient>
    <linearGradient id="boardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#323C46" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E242B" stop-opacity="0.9" />
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Executive Slate Gradient Background -->
  <rect width="1200" height="675" fill="url(#consultBg)" />

  <!-- Strategic Grid & Economic Growth Line Overlay -->
  <g opacity="0.12" stroke="#C5A059" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Corporate Skyline Silhouette -->
  <g fill="#1B2127" opacity="0.5">
    <rect x="150" y="220" width="85" height="280" />
    <rect x="250" y="180" width="120" height="320" />
    <rect x="400" y="140" width="140" height="360" />
    <rect x="860" y="190" width="110" height="310" />
    <rect x="990" y="160" width="130" height="340" />
  </g>

  <!-- Central Strategic Management & PMO Analytics Console -->
  <g transform="translate(300, 100)">
    <!-- Main Board Glass Screen -->
    <rect x="0" y="0" width="600" height="370" rx="16" fill="url(#boardGlass)" stroke="#C5A059" stroke-width="2.5" filter="url(#goldGlow)" />
    <!-- Screen Header Bar -->
    <rect x="0" y="0" width="600" height="45" rx="16" fill="#252C34" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#DFC48B" font-family="sans-serif" font-size="12" font-weight="bold">PAKISTANI CONSULTANCY SERVICES // STRATEGIC PMO &amp; FEASIBILITY ENGINE</text>

    <!-- Sub-Dashboard 1: Financial Feasibility & ROI Trend Analysis (Left) -->
    <g transform="translate(25, 65)">
      <rect width="260" height="155" rx="10" fill="#1A2027" stroke="#3A444E" stroke-width="1.5" />
      <text x="15" y="24" fill="#DFC48B" font-family="sans-serif" font-size="11" font-weight="bold">PROJECT FINANCIAL FEASIBILITY (NPV / IRR)</text>
      <!-- Coordinate Grid -->
      <line x1="25" y1="130" x2="235" y2="130" stroke="#4F5963" stroke-width="1" />
      <line x1="25" y1="40" x2="25" y2="130" stroke="#4F5963" stroke-width="1" />
      <!-- Area Fill Graph -->
      <polygon points="25,120 60,105 100,110 140,80 180,65 225,45 225,130 25,130" fill="#C5A059" fill-opacity="0.2" />
      <!-- Trend Line -->
      <polyline points="25,120 60,105 100,110 140,80 180,65 225,45" fill="none" stroke="#C5A059" stroke-width="2.5" />
      <circle cx="60" cy="105" r="3.5" fill="#C5A059" />
      <circle cx="100" cy="110" r="3.5" fill="#C5A059" />
      <circle cx="140" cy="80" r="3.5" fill="#C5A059" />
      <circle cx="180" cy="65" r="3.5" fill="#C5A059" />
      <circle cx="225" cy="45" r="5" fill="#10B981" />
      <text x="175" y="40" fill="#10B981" font-family="sans-serif" font-size="9.5" font-weight="bold">+28.4% IRR</text>
    </g>

    <!-- Sub-Dashboard 2: PMO Gantt Timeline & Milestone Schedule (Right) -->
    <g transform="translate(310, 65)">
      <rect width="265" height="155" rx="10" fill="#1A2027" stroke="#3A444E" stroke-width="1.5" />
      <text x="15" y="24" fill="#DFC48B" font-family="sans-serif" font-size="11" font-weight="bold">PMO MILESTONE GOVERNANCE</text>
      <!-- Gantt Bars -->
      <g transform="translate(15, 38)">
        <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="9">Feasibility &amp; EIA</text>
        <rect x="90" y="3" width="70" height="12" rx="3" fill="#C5A059" />
        
        <text x="0" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="9">Tender &amp; RFP</text>
        <rect x="140" y="25" width="55" height="12" rx="3" fill="#C5A059" />

        <text x="0" y="56" fill="#E2E8F0" font-family="sans-serif" font-size="9">EPC Contractor</text>
        <rect x="170" y="47" width="80" height="12" rx="3" fill="#10B981" />

        <text x="0" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="9">Quality Audit</text>
        <rect x="200" y="69" width="50" height="12" rx="3" fill="#38BDF8" />
      </g>
    </g>

    <!-- Bottom Advisory Telemetry Log -->
    <g transform="translate(25, 235)">
      <rect width="550" height="115" rx="10" fill="#141A21" stroke="#3A444E" stroke-width="1.5" />
      <text x="15" y="25" fill="#DFC48B" font-family="monospace" font-size="11">&gt; feasibility_study.evaluate(sector=&quot;Infrastructure_PPP&quot;, capex=&quot;$45M&quot;, status=&quot;VIABLE&quot;)</text>
      <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">&gt; procurement_audit.verify_ppra_compliance(rfp_id=&quot;PAK-2026-88&quot;, result=&quot;APPROVED&quot;)</text>
      <text x="15" y="71" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; pmo_supervision.track_milestones(completed=12, ongoing=3, variance=&quot;0.0 days&quot;)</text>
      <text x="15" y="94" fill="#38BDF8" font-family="monospace" font-size="11">&gt; [OK] STRATEGIC ADVISORY REPORT PUBLISHED // 400+ STUDIES DELIVERED</text>
    </g>
  </g>

  <!-- Left Floating Strategic Compass / Balance Scale Badge -->
  <g transform="translate(90, 180)">
    <rect width="180" height="240" rx="16" fill="#1F262E" stroke="#C5A059" stroke-width="2" filter="url(#goldGlow)" />
    <!-- Balance Scales Icon Graphic -->
    <g transform="translate(90, 80)">
      <!-- Scale Mast & Beam -->
      <line x1="0" y1="-30" x2="0" y2="40" stroke="#C5A059" stroke-width="3" />
      <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#DFC48B" stroke-width="3" />
      <!-- Scale Left Pan -->
      <line x1="-50" y1="-20" x2="-65" y2="10" stroke="#C5A059" stroke-width="1.5" />
      <line x1="-50" y1="-20" x2="-35" y2="10" stroke="#C5A059" stroke-width="1.5" />
      <ellipse cx="-50" cy="10" rx="18" ry="4" fill="#C5A059" />
      <!-- Scale Right Pan -->
      <line x1="50" y1="-20" x2="35" y2="10" stroke="#C5A059" stroke-width="1.5" />
      <line x1="50" y1="-20" x2="65" y2="10" stroke="#C5A059" stroke-width="1.5" />
      <ellipse cx="50" cy="10" rx="18" ry="4" fill="#C5A059" />
    </g>
    <text x="90" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FIDIC &amp; PPRA</text>
    <text x="90" y="182" fill="#DFC48B" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">COMPLIANCE ASSURED</text>
    <text x="90" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Strategic Advisory</text>
  </g>

  <!-- Right Floating Corporate Partnership Handshake Emblem -->
  <g transform="translate(930, 180)">
    <rect width="190" height="240" rx="16" fill="#1F262E" stroke="#C5A059" stroke-width="2" filter="url(#goldGlow)" />
    <!-- Briefcase / Deal Emblem -->
    <g transform="translate(95, 80)">
      <rect x="-35" y="-15" width="70" height="45" rx="6" fill="#3A444E" stroke="#C5A059" stroke-width="2" />
      <path d="M-15,-15 V-25 A8,8 0 0,1 15,-25 V-15" stroke="#C5A059" stroke-width="2.5" fill="none" />
      <line x1="-35" y1="5" x2="35" y2="5" stroke="#C5A059" stroke-width="1.5" />
      <circle cx="0" cy="5" r="4" fill="#DFC48B" />
    </g>
    <text x="95" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PPP &amp; TRANSACTION</text>
    <text x="95" y="182" fill="#DFC48B" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">ADVISORY SERVICES</text>
    <text x="95" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Institutional Financing</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="470" height="65" rx="16" fill="#1F262E" stroke="#C5A059" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#C5A059" />
    <text x="64" y="29" fill="#DFC48B" font-family="sans-serif" font-size="13" font-weight="bold">PAKISTANI CONSULTANCY SERVICES</text>
    <text x="64" y="47" fill="#F4F6F8" font-family="sans-serif" font-size="10.5">Strategic Advisory · Feasibility Studies · PMO &amp; Procurement</text>
  </g>
</svg>
