<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="nfsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F0918" />
      <stop offset="60%" stop-color="#6B0F24" />
      <stop offset="100%" stop-color="#8C1832" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#DFC48B" />
      <stop offset="100%" stop-color="#A6823B" />
    </linearGradient>
    <linearGradient id="kitchenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C0D20" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#380611" stop-opacity="0.9" />
    </linearGradient>
    <filter id="nfsGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Maroon Gradient Background -->
  <rect width="1200" height="675" fill="url(#nfsBg)" />

  <!-- Culinary Geometric & Cold Chain Grid -->
  <g opacity="0.12" stroke="#DFC48B" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Industrial Kitchen Equipment Silhouettes -->
  <g fill="#33050F" opacity="0.4">
    <rect x="120" y="240" width="110" height="260" rx="8" />
    <rect x="250" y="200" width="130" height="300" rx="8" />
    <rect x="850" y="210" width="120" height="290" rx="8" />
    <rect x="990" y="180" width="140" height="320" rx="8" />
  </g>

  <!-- Central Institutional Catering Operations & HACCP Monitoring Console -->
  <g transform="translate(300, 100)">
    <!-- Main Console Card -->
    <rect x="0" y="0" width="600" height="370" rx="16" fill="url(#kitchenGlass)" stroke="#C5A059" stroke-width="2.5" filter="url(#nfsGlow)" />
    <!-- Header Bar -->
    <rect x="0" y="0" width="600" height="45" rx="16" fill="#3D0713" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#DFC48B" font-family="sans-serif" font-size="12" font-weight="bold">NATIONAL FOOD SERVICES (NFS) // CENTRAL KITCHEN &amp; SUPPLY TELEMETRY</text>

    <!-- Sub-Dashboard 1: Cold Chain & Temperature Control (Left) -->
    <g transform="translate(25, 65)">
      <rect width="260" height="155" rx="10" fill="#2A050D" stroke="#6B0F24" stroke-width="1.5" />
      <text x="15" y="24" fill="#DFC48B" font-family="sans-serif" font-size="11" font-weight="bold">COLD-CHAIN TEMPERATURE TELEMETRY</text>
      <!-- Temperature Telemetry Waves -->
      <line x1="25" y1="130" x2="235" y2="130" stroke="#8C1832" stroke-width="1" />
      <line x1="25" y1="40" x2="25" y2="130" stroke="#8C1832" stroke-width="1" />
      <!-- Steady Refrig Line (+3.8 deg C) -->
      <path d="M 25,85 Q 50,80 75,85 T 125,85 T 175,85 T 225,85" fill="none" stroke="#38BDF8" stroke-width="2.5" />
      <circle cx="125" cy="85" r="4" fill="#38BDF8" />
      <circle cx="225" cy="85" r="5" fill="#10B981" />
      <text x="165" y="75" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">+3.8°C OPTIMAL</text>
      <text x="35" y="115" fill="#E2E8F0" font-family="sans-serif" font-size="9.5">HACCP Cold Storage Chiller #4 Active</text>
    </g>

    <!-- Sub-Dashboard 2: Meal Preparation Throughput & Nutrition (Right) -->
    <g transform="translate(310, 65)">
      <rect width="265" height="155" rx="10" fill="#2A050D" stroke="#6B0F24" stroke-width="1.5" />
      <text x="15" y="24" fill="#DFC48B" font-family="sans-serif" font-size="11" font-weight="bold">DAILY MEAL DISPATCH BY SECTOR</text>
      <!-- Horizontal Bars -->
      <g transform="translate(15, 38)">
        <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="9">Corporate HQ</text>
        <rect x="95" y="3" width="90" height="12" rx="3" fill="#C5A059" />
        <text x="195" y="13" fill="#DFC48B" font-family="sans-serif" font-size="9" font-weight="bold">45K</text>
        
        <text x="0" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="9">Hospital Diet</text>
        <rect x="95" y="25" width="75" height="12" rx="3" fill="#10B981" />
        <text x="180" y="35" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">35K</text>

        <text x="0" y="56" fill="#E2E8F0" font-family="sans-serif" font-size="9">Universities</text>
        <rect x="95" y="47" width="110" height="12" rx="3" fill="#38BDF8" />
        <text x="215" y="57" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">60K</text>

        <text x="0" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="9">Industrial Sites</text>
        <rect x="95" y="69" width="130" height="12" rx="3" fill="#EC4899" />
        <text x="235" y="79" fill="#EC4899" font-family="sans-serif" font-size="9" font-weight="bold">80K</text>
      </g>
    </g>

    <!-- Bottom Kitchen Operations Log -->
    <g transform="translate(25, 235)">
      <rect width="550" height="115" rx="10" fill="#20040A" stroke="#6B0F24" stroke-width="1.5" />
      <text x="15" y="25" fill="#DFC48B" font-family="monospace" font-size="11">&gt; nfs_kitchen.dispatch_meals(clients=350, daily_target=&quot;1,000,000+ meals&quot;, status=&quot;ON_SCHEDULE&quot;)</text>
      <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">&gt; haccp_audit.verify_sterilization(atp_swab=&quot;PASS&quot;, core_temp=&quot;75°C&quot;, hygiene=&quot;GRADE-A&quot;)</text>
      <text x="15" y="71" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; cold_chain_fleet.sync_refrigeration(trucks=48, temp_range=&quot;2°C to 4°C&quot;, status=&quot;ALL_OPTIMAL&quot;)</text>
      <text x="15" y="94" fill="#38BDF8" font-family="monospace" font-size="11">&gt; [OK] NATIONAL FOOD SERVICES CATERING FLEET SYNCHRONIZED NATIONWIDE</text>
    </g>
  </g>

  <!-- Left Floating HACCP & Food Safety Certified Shield -->
  <g transform="translate(90, 180)">
    <rect width="180" height="240" rx="16" fill="#380611" stroke="#C5A059" stroke-width="2" filter="url(#nfsGlow)" />
    <!-- Shield & Utensil Emblem -->
    <g transform="translate(90, 80)">
      <!-- Shield Path -->
      <path d="M-35,-25 H35 V10 C35,35 0,55 0,55 C0,55 -35,35 -35,10 Z" fill="#4F0918" stroke="#C5A059" stroke-width="2" />
      <!-- Chef Hat / Cloche Silhouette -->
      <circle cx="0" cy="5" r="14" fill="#C5A059" />
      <rect x="-12" y="10" width="24" height="6" rx="2" fill="#DFC48B" />
      <circle cx="-7" cy="0" r="6" fill="#DFC48B" />
      <circle cx="7" cy="0" r="6" fill="#DFC48B" />
    </g>
    <text x="90" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HACCP &amp; ISO 22000</text>
    <text x="90" y="182" fill="#DFC48B" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">CERTIFIED SAFETY</text>
    <text x="90" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">100% Halal Verified</text>
  </g>

  <!-- Right Floating Institutional Meal Serving Cloche Badge -->
  <g transform="translate(930, 180)">
    <rect width="190" height="240" rx="16" fill="#380611" stroke="#C5A059" stroke-width="2" filter="url(#nfsGlow)" />
    <!-- Cloche Platter Icon -->
    <g transform="translate(95, 80)">
      <!-- Dome Cloche -->
      <path d="M-35,15 C-35,-15 35,-15 35,15 Z" fill="#4F0918" stroke="#C5A059" stroke-width="2.5" />
      <circle cx="0" cy="-18" r="5" fill="#DFC48B" />
      <!-- Platter Base -->
      <rect x="-45" y="16" width="90" height="6" rx="3" fill="#C5A059" />
    </g>
    <text x="95" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1,000,000+ MEALS</text>
    <text x="95" y="182" fill="#DFC48B" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">SERVED DAILY</text>
    <text x="95" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Institutional Catering</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="470" height="65" rx="16" fill="#380611" stroke="#C5A059" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#C5A059" />
    <text x="64" y="29" fill="#DFC48B" font-family="sans-serif" font-size="13" font-weight="bold">NATIONAL FOOD SERVICES (NFS)</text>
    <text x="64" y="47" fill="#FAF5F6" font-family="sans-serif" font-size="10.5">Institutional Catering · Healthcare Nutrition · Food Supply Chain</text>
  </g>
</svg>
