<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="indSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="50%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#0F2440" />
    </linearGradient>
    <linearGradient id="emeraldNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="indGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E6B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B1A2E" stop-opacity="0.9" />
    </linearGradient>
    <filter id="indGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic"2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Industrial Navy Background -->
  <rect width="1200" height="675" fill="url(#indSky)" />

  <!-- Industrial Procurement Logistics & Engineering Grid -->
  <g opacity="0.15" stroke="#16A34A" stroke-width="1.5" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Distant Heavy Steel Manufacturing & Port Cranes Silhouettes -->
  <g fill="#071220" opacity="0.65">
    <polygon points="60,500 120,380 180,500" />
    <rect x="180" y="240" width="100" height="260" rx="4" />
    <polygon points="280,500 340,360 400,500" />
    <!-- Gantry Crane Outline -->
    <path d="M840,500 L840,220 L1020,180 L1120,180 L1120,500" stroke="#0F2440" stroke-width="6" fill="none" />
    <rect x="920" y="260" width="120" height="240" rx="4" />
  </g>

  <!-- Central Industrial Procurement & Heavy Machinery Telemetry Console -->
  <g transform="translate(300, 100)">
    <!-- Main Board Glass Screen -->
    <rect x="0" y="0" width="600" height="370" rx="16" fill="url(#indGlass)" stroke="#16A34A" stroke-width="2.5" filter="url(#indGlow)" />
    <!-- Header Bar -->
    <rect x="0" y="0" width="600" height="45" rx="16" fill="#0C1F38" />
    <circle cx="25" cy="22" r="5" fill="#EF4444" />
    <circle cx="45" cy="22" r="5" fill="#F59E0B" />
    <circle cx="65" cy="22" r="5" fill="#10B981" />
    <text x="95" y="27" fill="#22C55E" font-family="sans-serif" font-size="12" font-weight="bold">MAX PAK CORPORATION // INDUSTRIAL TRADING &amp; COMMERCIAL PROCUREMENT</text>

    <!-- Sub-Dashboard 1: Equipment & Material Dispatch Telemetry (Left) -->
    <g transform="translate(25, 65)">
      <rect width="260" height="155" rx="10" fill="#061220" stroke="#1B365D" stroke-width="1.5" />
      <text x="15" y="24" fill="#22C55E" font-family="sans-serif" font-size="11" font-weight="bold">SUPPLY CHAIN INVENTORY (%)</text>
      <!-- Equipment Category Chart -->
      <g transform="translate(15, 38)">
        <text x="0" y="12" fill="#E2E8F0" font-family="sans-serif" font-size="9">Heavy Earthmoving Plants</text>
        <rect x="115" y="3" width="105" height="12" rx="3" fill="#16A34A" />
        <text x="225" y="13" fill="#22C55E" font-family="sans-serif" font-size="9" font-weight="bold">96%</text>
        
        <text x="0" y="34" fill="#E2E8F0" font-family="sans-serif" font-size="9">Structural Steel &amp; Rebar</text>
        <rect x="115" y="25" width="120" height="12" rx="3" fill="#38BDF8" />
        <text x="240" y="35" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">99%</text>

        <text x="0" y="56" fill="#E2E8F0" font-family="sans-serif" font-size="9">Pumps, Valves &amp; Switchgear</text>
        <rect x="115" y="47" width="110" height="12" rx="3" fill="#F59E0B" />
        <text x="230" y="57" fill="#F59E0B" font-family="sans-serif" font-size="9" font-weight="bold">95%</text>

        <text x="0" y="78" fill="#E2E8F0" font-family="sans-serif" font-size="9">Industrial PPE &amp; Safety</text>
        <rect x="115" y="69" width="125" height="12" rx="3" fill="#10B981" />
        <text x="245" y="79" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="bold">100%</text>
      </g>
    </g>

    <!-- Sub-Dashboard 2: Quality Inspection & Compliance (Right) -->
    <g transform="translate(310, 65)">
      <rect width="265" height="155" rx="10" fill="#061220" stroke="#1B365D" stroke-width="1.5" />
      <text x="15" y="24" fill="#22C55E" font-family="sans-serif" font-size="11" font-weight="bold">QUALITY CONTROL VERIFICATION</text>
      <!-- Telemetry Rings -->
      <g transform="translate(15, 42)">
        <circle cx="20" cy="20" r="16" fill="#1B365D" stroke="#16A34A" stroke-width="1.5" />
        <text x="20" y="24" fill="#22C55E" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ISO</text>
        <text x="45" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">ISO 9001:2015 QA</text>
        <text x="45" y="32" fill="#94A3B8" font-family="sans-serif" font-size="8.5">ASTM / DIN / BS Certified</text>

        <circle cx="20" cy="65" r="16" fill="#1B365D" stroke="#38BDF8" stroke-width="1.5" />
        <text x="20" y="69" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">99%</text>
        <text x="45" y="63" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="bold">On-Time Logistics Rate</text>
        <text x="45" y="77" fill="#94A3B8" font-family="sans-serif" font-size="8.5">24/7 Site Delivery Support</text>
      </g>
    </g>

    <!-- Bottom Telemetry Terminal Log -->
    <g transform="translate(25, 235)">
      <rect width="550" height="115" rx="10" fill="#040C16" stroke="#1B365D" stroke-width="1.5" />
      <text x="15" y="25" fill="#22C55E" font-family="monospace" font-size="11">&gt; maxpak_supply.dispatch_batch(item=&quot;API-5L Grade X65 Linepipe&quot;, status=&quot;QC_PASSED&quot;)</text>
      <text x="15" y="48" fill="#10B981" font-family="monospace" font-size="11">&gt; machinery_fleet.deploy_crane(capacity=&quot;150-Ton Crawler&quot;, loc=&quot;Industrial Zone&quot;)</text>
      <text x="15" y="71" fill="#E2E8F0" font-family="monospace" font-size="11">&gt; procurement_gateway.audit_mfr_certs(origin=&quot;GER/JPN/USA&quot;, compliance=&quot;100%&quot;)</text>
      <text x="15" y="94" fill="#38BDF8" font-family="monospace" font-size="11">&gt; [OK] 10,000+ PRODUCTS DELIVERED // 2,500+ COMPLETED PROJECTS // 800+ CLIENTS</text>
    </g>
  </g>

  <!-- Left Floating 10,000+ Products Supplied Badge -->
  <g transform="translate(90, 180)">
    <rect width="180" height="240" rx="16" fill="#0E233E" stroke="#16A34A" stroke-width="2" filter="url(#indGlow)" />
    <!-- Gear & Box Graphic -->
    <g transform="translate(90, 80)">
      <circle cx="0" cy="0" r="26" fill="#1B365D" stroke="#16A34A" stroke-width="2" />
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="#16A34A" />
      <path d="M-8,-4 L0,4 L8,-4" fill="none" stroke="#FFFFFF" stroke-width="2" />
    </g>
    <text x="90" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10,000+ INDUSTRIAL</text>
    <text x="90" y="182" fill="#22C55E" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">PRODUCTS SUPPLIED</text>
    <text x="90" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Global Brand Partners</text>
  </g>

  <!-- Right Floating 2,500+ Projects Completed Emblem -->
  <g transform="translate(930, 180)">
    <rect width="190" height="240" rx="16" fill="#0E233E" stroke="#16A34A" stroke-width="2" filter="url(#indGlow)" />
    <!-- Shield / Checkmark Emblem -->
    <g transform="translate(95, 80)">
      <polygon points="0,-24 22,-10 18,18 0,28 -18,18 -22,-10" fill="#1B365D" stroke="#22C55E" stroke-width="2" />
      <polyline points="-8,2 -2,8 8,-4" fill="none" stroke="#22C55E" stroke-width="3" />
    </g>
    <text x="95" y="165" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2,500+ PROJECTS</text>
    <text x="95" y="182" fill="#22C55E" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">SUCCESSFULLY EXECUTED</text>
    <text x="95" y="205" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">99% On-Time Delivery</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="520" height="65" rx="16" fill="#0E233E" stroke="#16A34A" stroke-width="2" />
    <circle cx="36" cy="32.5" r="14" fill="#16A34A" />
    <text x="64" y="29" fill="#22C55E" font-family="sans-serif" font-size="13" font-weight="bold">MAX PAK CORPORATION</text>
    <text x="64" y="47" fill="#F8FAFC" font-family="sans-serif" font-size="10.5">Industrial Machinery · Construction Materials · Turnkey EPC Procurement</text>
  </g>
</svg>
