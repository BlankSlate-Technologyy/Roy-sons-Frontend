<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blueprintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B01B2E" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.6" />
    </pattern>
    <filter id="planGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#blueprintBg)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Master Planned Community Grid & Boulevards -->
  <g transform="translate(60, 80)">
    <!-- Main Boulevard (Dual Carriageway) -->
    <path d="M40,240 Q250,220 450,250 T680,240" stroke="#475569" stroke-width="36" stroke-linecap="round" fill="none" />
    <path d="M40,240 Q250,220 450,250 T680,240" stroke="#FFD54F" stroke-width="2" stroke-dasharray="8,8" fill="none" />

    <!-- Secondary Access Roads -->
    <line x1="200" y1="60" x2="200" y2="440" stroke="#334155" stroke-width="20" stroke-linecap="round" />
    <line x1="450" y1="60" x2="450" y2="440" stroke="#334155" stroke-width="20" stroke-linecap="round" />

    <!-- Residential Sector A (Luxury Smart Villas) -->
    <g transform="translate(60, 70)">
      <rect x="0" y="0" width="110" height="130" rx="8" fill="#1E293B" stroke="#B01B2E" stroke-width="2" />
      <rect x="15" y="15" width="80" height="45" rx="4" fill="#38BDF8" opacity="0.3" stroke="#38BDF8" stroke-width="1.5" />
      <text x="25" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">VILLA 01</text>
      <rect x="15" y="70" width="80" height="45" rx="4" fill="#38BDF8" opacity="0.3" stroke="#38BDF8" stroke-width="1.5" />
      <text x="25" y="97" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">VILLA 02</text>
    </g>

    <!-- Central Central Eco-Park & Lake -->
    <g transform="translate(230, 70)">
      <rect x="0" y="0" width="190" height="130" rx="16" fill="#14532D" stroke="#22C55E" stroke-width="2" />
      <!-- Organic Lake Contour -->
      <path d="M30,60 Q80,25 130,50 T160,95 Q100,120 50,95 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2" />
      <text x="55" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">ECO LAKE</text>
      <circle cx="45" cy="40" r="8" fill="#22C55E" />
      <circle cx="150" cy="35" r="10" fill="#22C55E" />
      <circle cx="140" cy="105" r="9" fill="#22C55E" />
    </g>

    <!-- Commercial Business Center & Towers -->
    <g transform="translate(480, 70)">
      <rect x="0" y="0" width="160" height="130" rx="8" fill="#1E293B" stroke="#E2E8F0" stroke-width="2" />
      <!-- High-Rise Tower Footprint -->
      <rect x="25" y="20" width="110" height="90" rx="6" fill="#B01B2E" opacity="0.85" filter="url(#planGlow)" />
      <text x="35" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">SWISS TOWER</text>
      <text x="38" y="76" fill="#FFE4E6" font-family="sans-serif" font-size="9">Commercial Hub</text>
    </g>

    <!-- Residential Sector B (Smart Apartments) -->
    <g transform="translate(60, 290)">
      <rect x="0" y="0" width="360" height="140" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2" />
      <rect x="20" y="20" width="95" height="100" rx="6" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
      <text x="35" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK A</text>
      <rect x="135" y="20" width="95" height="100" rx="6" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
      <text x="150" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK B</text>
      <rect x="250" y="20" width="90" height="100" rx="6" fill="#334155" stroke="#38BDF8" stroke-width="1.5" />
      <text x="265" y="75" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">BLOCK C</text>
    </g>

    <!-- Community Club & Sports Complex -->
    <g transform="translate(480, 290)">
      <rect x="0" y="0" width="160" height="140" rx="8" fill="#1E293B" stroke="#22C55E" stroke-width="2" />
      <circle cx="80" cy="70" r="45" fill="#14532D" stroke="#22C55E" stroke-width="2" />
      <text x="45" y="66" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">COMMUNITY</text>
      <text x="52" y="80" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">CLUB &amp; SPA</text>
    </g>
  </g>

  <!-- Top Badge Overlay -->
  <g transform="translate(60, 30)">
    <rect width="320" height="42" rx="10" fill="#B01B2E" />
    <text x="20" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">BIM SMART MASTER PLANNING</text>
  </g>
</svg>
